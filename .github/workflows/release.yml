name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          # Build the tagged commit, not whatever master points at now.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Re-attach HEAD
        # release-it runs `git symbolic-ref HEAD` during init, which fails on the
        # detached HEAD that a tag checkout leaves behind. Point HEAD at a local
        # branch on the tagged commit so the release uses the right tree.
        run: git checkout -B release-${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          CI: true

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test --coverage --pool.maxWorkers=2

      - name: Build
        run: yarn build

      - name: Release
        run: npx release-it --ci --no-increment --npm.publish --github.release --git.commit=false --git.tag=false --git.push=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
